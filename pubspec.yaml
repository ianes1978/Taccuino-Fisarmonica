name: taccuino_fisarmonica
description: "Taccuino Fisarmonica — un blocco note musicale per annotare assoli di fisarmonica."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  google_fonts: ^6.2.1
  flutter_soloud: ^3.1.0
  web: ^1.1.0
  pdf: ^3.11.1
  printing: ^5.13.3
  file_saver: ^0.2.14
  # file_picker: serve la serie 10.x. La 8.x compila hardcoded contro
  # android-34 (rompe il check AAR con i plugin a compileSdk 36); la 11.x
  # ha un bug di registrazione Android (GeneratedPluginRegistrant non trova
  # FilePickerPlugin). La 10.3.x segue flutter.compileSdkVersion e registra
  # correttamente.
  file_picker: ">=10.3.11 <11.0.0"

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png

# Icona app (Android + Web), generata in CI da assets/icon/app_icon.png.
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  min_sdk_android: 21
  adaptive_icon_background: "#002158"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#002158"
    theme_color: "#C8A45A"
