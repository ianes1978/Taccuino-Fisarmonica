name: build-and-deploy

on:
  push:
    branches:
      - main
      - master
      - claude/taccuino-fisarmonica-app-qy6fc4
  workflow_dispatch:

# GITHUB_TOKEN permissions for Pages deploy + release upload.
permissions:
  contents: write
  pages: write
  id-token: write

# Un solo deploy Pages alla volta.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------ Build web ---------
  # Builda sempre (valida la compilazione web) e carica l'artifact per Pages.
  build_web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Genera lo scaffolding delle piattaforme (android/web) non versionato.
      - name: Generate platform scaffolding
        run: flutter create --platforms=android,web --project-name taccuino_fisarmonica --org com.taccuino .

      - run: flutter pub get

      - name: Build web
        # base-href deve combaciare col nome del repo per GitHub Pages.
        run: |
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          flutter build web --release --base-href "/${REPO_NAME}/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  # ------------------------------------------------------ Deploy Pages ------
  # Il deploy su Pages avviene solo sul ramo di default (le regole dell'ambiente
  # github-pages bloccano gli altri rami). Richiede una tantum:
  # Settings -> Pages -> Source: GitHub Actions.
  deploy_pages:
    needs: build_web
    if: ${{ github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

  # ---------------------------------------------------------- Android -------
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform scaffolding
        run: flutter create --platforms=android,web --project-name taccuino_fisarmonica --org com.taccuino .

      - run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: taccuino-fisarmonica-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # Pubblica l'APK come release "latest" solo sul ramo di default.
      - name: Publish APK release
        if: ${{ github.ref_name == github.event.repository.default_branch }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: "Taccuino Fisarmonica — APK (latest)"
          files: build/app/outputs/flutter-apk/app-release.apk
          make_latest: true
