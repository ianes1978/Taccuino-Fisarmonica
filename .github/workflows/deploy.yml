name: build-and-deploy

on:
  push:
    branches:
      - main
      - master
      - claude/taccuino-fisarmonica-app-qy6fc4
  workflow_dispatch:

# contents: write  -> push del ramo gh-pages e creazione release APK
# pages:    write  -> impostare la sorgente Pages via API REST
permissions:
  contents: write
  pages: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------ Web -> gh-pages ----
  # Builda il web e lo pubblica sul ramo gh-pages, poi imposta la sorgente
  # Pages = ramo gh-pages via API. Questo evita del tutto l'ambiente
  # "github-pages" (le cui regole di protezione bloccavano il deploy dal ramo).
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Genera lo scaffolding delle piattaforme (android/web) non versionato.
      - name: Generate platform scaffolding
        run: flutter create --platforms=android,web --project-name taccuino_fisarmonica --org com.taccuino .

      - run: flutter pub get

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Build web
        # base-href deve combaciare col nome del repo per GitHub Pages.
        run: |
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          flutter build web --release --base-href "/${REPO_NAME}/"

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          publish_branch: gh-pages
          # .nojekyll è aggiunto in automatico (enable_jekyll: false di default)

      - name: Point GitHub Pages at gh-pages branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          body='{"source":{"branch":"gh-pages","path":"/"},"build_type":"legacy"}'
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$api" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d "$body")
          echo "POST /pages -> HTTP $code"
          if [ "$code" != "201" ]; then
            # Pages già esistente: aggiorna la sorgente al ramo gh-pages.
            put=$(curl -s -o /dev/null -w "%{http_code}" -X PUT "$api" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -d "$body")
            echo "PUT /pages -> HTTP $put"
          fi
          echo "Sito: https://${GITHUB_REPOSITORY%%/*}.github.io/${GITHUB_REPOSITORY##*/}/"

  # ---------------------------------------------------------- Android -------
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform scaffolding
        run: flutter create --platforms=android,web --project-name taccuino_fisarmonica --org com.taccuino .

      # Alcuni plugin (es. flutter_plugin_android_lifecycle via file_picker)
      # richiedono compileSdk 36. Forziamolo su TUTTI i sottoprogetti (app +
      # plugin) aggiungendo un blocco subprojects al build.gradle.kts di root,
      # più il valore esplicito nell'app.
      - name: Force Android compileSdk 36
        run: |
          app_kts=android/app/build.gradle.kts
          if [ -f "$app_kts" ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' "$app_kts"
          fi
          root_kts=android/build.gradle.kts
          if [ -f "$root_kts" ]; then
            cat >> "$root_kts" <<'EOF'

// Forza compileSdk 36 su tutti i moduli (plugin inclusi).
subprojects {
    afterEvaluate {
        extensions.findByName("android")?.let { ext ->
            (ext as com.android.build.gradle.BaseExtension).compileSdkVersion(36)
        }
    }
}
EOF
          fi
          echo '--- root build.gradle.kts (tail) ---'
          tail -n 15 "$root_kts" 2>/dev/null || true

      - run: flutter pub get

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: taccuino-fisarmonica-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # Pubblica l'APK come release "latest".
      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: "Taccuino Fisarmonica — APK (latest)"
          files: build/app/outputs/flutter-apk/app-release.apk
          make_latest: true
